name: Cross-Compile & Release

on:
  # Allows you to click "Run workflow" manually from the Actions tab for testing
  workflow_dispatch: 
  # Automatically runs when you push a tag like "v1.0.0"
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # Prevents one OS failure from canceling the others
      matrix:
        include:
          - os-name: Windows
            runner: windows-latest
            artifact-name: sopita-windows
          - os-name: Linux
            runner: ubuntu-latest
            artifact-name: sopita-linux
          - os-name: Mac-Intel
            runner: macos-13
            artifact-name: sopita-mac-intel
          - os-name: Mac-Silicon
            runner: macos-latest
            artifact-name: sopita-mac-silicon

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2 # Upgraded to v2 to fix Node 20 warnings
        with:
          bun-version: latest

      # Install Linux build essentials and webview dependencies
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev

      - name: Install Dependencies
        run: bun install

      # Uses your specific stable build script
      - name: Build Application
        run: bun run build:stable 

      # Grabs the compiled output so it can be passed to the Release job.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/ 

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Zips the folders up and attaches them to a new GitHub Release page
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true