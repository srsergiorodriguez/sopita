name: Cross-Compile & Release

on:
  # Allows you to click "Run workflow" manually from the Actions tab for testing
  workflow_dispatch: 
  # Automatically runs when you push a tag like "v1.0.0"
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # Prevents one OS failure from canceling the others
      matrix:
        include:
          - os-name: Windows
            runner: windows-latest
            artifact-name: sopita-windows
          - os-name: Linux
            runner: ubuntu-latest
            artifact-name: sopita-linux
          - os-name: Mac-Intel
            runner: macos-13
            artifact-name: sopita-mac-intel
          - os-name: Mac-Silicon
            runner: macos-latest
            artifact-name: sopita-mac-silicon

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2 # Upgraded to v2 to fix Node 20 warnings
        with:
          bun-version: latest

      # Install Linux build essentials and webview dependencies
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev

      - name: Install Dependencies
        run: bun install

      # Uses your specific stable build script[cite: 1]
      - name: Build Application
        run: bun run build:stable 

      # Install rcedit globally to bypass the Electrobun framework bug
      - name: Install rcedit (Windows)
        if: runner.os == 'Windows'
        run: npm install -g rcedit

      # Forcibly inject the icon into both executables
      - name: Inject Icon (Windows)
        if: runner.os == 'Windows'
        run: |
          rcedit "build\stable-win-x64\Sopita\launcher.exe" --set-icon "assets\sopitaIcon.ico"
          rcedit "build\stable-win-x64\Sopita\bun.exe" --set-icon "assets\sopitaIcon.ico"

      # Locates the .app bundle and applies a local, anonymous signature so it opens on macOS
      - name: Ad-Hoc Sign macOS Binary
        if: runner.os == 'macOS'
        run: find build -name "*.app" -exec codesign --force --deep -s - {} \;

      # Zips the raw Windows executable folder to bypass the broken installer
      - name: Zip Windows Build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build\stable-win-x64\Sopita\* -DestinationPath build\Sopita-Windows.zip

      # Grabs the compiled output so it can be passed to the Release job.[cite: 1]
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/ 

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') #[cite: 1]
    runs-on: ubuntu-latest
    steps:
      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Zips the folders up and attaches them to a new GitHub Release page[cite: 1]
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true #[cite: 1]